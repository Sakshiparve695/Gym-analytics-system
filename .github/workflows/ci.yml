name: GymPulse CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test GymPulse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile Gym_Management_System.py
          python -m py_compile etl.py
          python -m py_compile nutrition_recommender.py
          python -m py_compile generate_members.py
          python -m py_compile Generate_Attendence.py

      - name: Validate FastAPI Application
        run: |
          python -c "from Gym_Management_System import app; print('FastAPI application loaded successfully')"

      - name: Validate Nutrition Recommendation Module
        run: |
          python -c "import nutrition_recommender; print('Nutrition recommendation module loaded successfully')"

      - name: Docker Compose Validation
        run: |
          docker compose config

      - name: Build Docker Containers
        run: |
          docker compose build